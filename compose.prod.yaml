# Production (ou recette) sur un serveur : docker compose -f compose.prod.yaml up -d --build
# Les secrets viennent du fichier .env posé sur le serveur (modèle : .env.production.example).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bouture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_DB: bouture
    volumes:
      - db-data:/var/lib/postgresql/data
    # Aucun port publié : la base n'est joignable que par les autres conteneurs
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'bouture']
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bouture:${POSTGRES_PASSWORD}@db:5432/bouture
      JWT_SECRET: ${JWT_SECRET:?à définir dans .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # Certificats HTTPS obtenus par Caddy, conservés entre deux redémarrages
      - caddy-data:/data
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
