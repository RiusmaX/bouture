# Les services nécessaires en développement. Lancer : docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bouture
      POSTGRES_PASSWORD: bouture
      POSTGRES_DB: bouture
    ports:
      - '127.0.0.1:5432:5432' # accessible depuis ce poste seulement
    volumes:
      # Les données survivent à l'arrêt du conteneur
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
